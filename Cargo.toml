[package]
name = "fire_os"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
bitflags = "2.13.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "fire_os"
test = false
bench = false

[lib]
doctest = false

[package.metadata.bootimage]
run-args = [
    "-serial", "stdio"
]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-timeout = 300 
test-success-exit-code = 33

[features]
default = []
serial-output = []
kernel-test = []

[[test]]
name = "stack_overflow_test"
harness = false
