[unstable]
json-target-spec = true
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins"]

[build]
target = "x86_64-fire_os.json"

[target.'cfg(target_os = "none")']
runner = "./scripts/bootimage-runner.sh" 

[alias]
xtest = "test --quiet --features serial-output,kernel-test"